        tags: ["Web App", "Route Planning"],
        blocks: [
          { h: "Problem", body: "Students commuting between Keelung and Taipei juggle a maze of bus and train options on a tight transit budget — planning an affordable route by hand is tedious." },
          { h: "Approach", body: "I built a web app that lays out the transfer options from Keelung to Taipei, so students can pick a route that fits their time and their fare." },
          { h: "Outcome", body: "My very first project — the one that got me building things people actually use." }
        ] }
    ]
  };
  const card = (x, orgFirst) => {
    const role = `${x.role}${x.when ? ` <span class="when">${x.when}</span>` : ''}`;
    return `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="ln1">${orgFirst ? x.org : role}</div>
          <div class="ln2">${orgFirst ? role : x.org}</div>
        </div>
        <span class="date">${x.date}</span>
      </div>
      ${x.bullets?.length ? `<ul>${x.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
      ${x.award ? `<div class="award">${x.award}</div>` : ''}
      ${x.tags?.length ? `<div class="tags">${x.tags.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
    </div>`;
  };

  const coverImg = p => `<img src="${p.cover}" alt="${p.title}"${p.coverPos ? ` style="object-position:${p.coverPos}"` : ''}>`;
  const cover = p => p.cover ? coverImg(p) : 'cover image';

  const project = (p, i) => `
    <button class="pcard" type="button" data-i="${i}">
      <div class="pcover">${cover(p)}</div>
      <div class="pbody">
        ${p.group ? `<div class="pgroup-tag">${p.group}</div>` : ''}
        <div class="ptitle">${p.title}</div>
        <div class="psum">${p.summary}</div>
        ${p.tags?.length ? `<div class="tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
        <div class="pmore">View details →</div>
      </div>
    </button>`;

  // modal detail for one project
  const projectModal = p => `
    <div class="modal-backdrop"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="${p.title}">
      <button class="modal-close" aria-label="Close">✕</button>
      <div class="modal-media">${p.video
        ? `<iframe src="https://www.youtube.com/embed/${p.video}" title="${p.title} demo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
        : (p.cover ? coverImg(p) : `<div class="ph">${'video' in p ? 'demo video coming soon' : 'cover image'}</div>`)}</div>
      <div class="modal-body">
        ${p.group ? `<div class="pgroup-tag">${p.group}</div>` : ''}
        <div class="modal-title">${p.title}${p.zh ? ` <span class="zh">${p.zh}</span>` : ''}</div>
        ${p.blocks.map(b => `<div class="pblock"><b>${b.h}</b><p>${b.body}</p></div>`).join('')}
        <div class="plinks">
          ${p.link ? `<a class="plink" href="${p.link.url}" target="_blank">${p.link.label}</a>` : ''}
          ${p.video ? `<a class="plink" href="https://youtu.be/${p.video}" target="_blank">Watch demo ↗</a>` : ''}
        </div>
      </div>
    </div>`;

  function render(){
    const p = DATA.profile;
    document.title = `${p.cloudName} · ${p.title}`;
    document.getElementById('tbName').textContent = p.cloudName;

    document.getElementById('about').innerHTML = `
      <div class="hero">
        <p class="greet">Hi, I'm</p>
        <div class="namecloud"><canvas id="nameCanvas"></canvas></div>
        <p class="aka"><b>${p.formalName}</b> · ${p.zhName}</p>
        <p class="role-title">${p.title}</p>
        ${p.location ? `<p class="loc">${p.location}</p>` : ''}
      </div>
      <p class="bio">${p.bio}</p>
      <div class="links">
        <a class="btn" href="${p.links.github}" target="_blank">GitHub</a>
        <a class="btn out" href="${p.links.linkedin}" target="_blank">LinkedIn</a>
        ${p.links.resume ? `<a class="btn out" href="${p.links.resume}" target="_blank">Resume ↓</a>` : ''}
      </div>
      <p class="sec-title">Contact</p>
      <div class="contact-row">
        ${p.links.email ? `<a href="mailto:${p.links.email}">${p.links.email}</a>` : ''}
        <a href="${p.links.github}" target="_blank">GitHub</a>
        <a href="${p.links.linkedin}" target="_blank">LinkedIn</a>
      </div>`;

    document.getElementById('experience').innerHTML =
      DATA.experience.map(x => card(x, true)).join('') +
      `<p class="sec-title">Education</p>` + DATA.education.map(x => card(x)).join('');

    document.getElementById('projects').innerHTML =
      `<div class="pgrid">` + DATA.projects.map(project).join('') + `</div>`;
  }
  render();

  // projects: click a card to open its detail in a modal
  const pmodal = document.getElementById('pmodal');
  function openProject(i){
    pmodal.innerHTML = projectModal(DATA.projects[i]);
    pmodal.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeProject(){
    pmodal.hidden = true;
    pmodal.innerHTML = '';
    document.body.style.overflow = '';
  }
  document.getElementById('projects').addEventListener('click', e => {
    const card = e.target.closest('.pcard');
    if(card) openProject(+card.dataset.i);
  });
  pmodal.addEventListener('click', e => {
    if(e.target.closest('.modal-close') || e.target.classList.contains('modal-backdrop')) closeProject();
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !pmodal.hidden) closeProject(); });

  // name particle cloud: sample the name to points, settle into place on load
  const canvas = document.getElementById('nameCanvas'), ctx = canvas.getContext('2d');
  let W, H, parts = [];
  const themePC = () => document.documentElement.dataset.theme === 'light' ? [26,107,84] : [168,240,207];
  let pc = themePC();

  function buildCloud(){
    if(!canvas.clientWidth) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const ox = off.getContext('2d');
    ox.fillStyle = '#fff'; ox.textAlign = 'center'; ox.textBaseline = 'middle';
    ox.font = '800 ' + Math.min(W*0.19, 100) + 'px Inter, sans-serif';
    ox.fillText(DATA.profile.cloudName, W/2, H/2);
    const img = ox.getImageData(0,0,W,H).data;
    parts = []; const gap = Math.max(3, Math.round(W/240));
    for(let yy=0; yy<H; yy+=gap) for(let xx=0; xx<W; xx+=gap){
      if(img[(yy*W+xx)*4+3] > 128) parts.push({hx:xx, hy:yy, x:Math.random()*W, y:Math.random()*H, vx:0, vy:0});
    }
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.vx += (p.hx-p.x)*0.012; p.vy += (p.hy-p.y)*0.012;
      p.vx *= 0.86; p.vy *= 0.86; p.x += p.vx; p.y += p.vy;
      const sp = Math.min(Math.abs(p.vx)+Math.abs(p.vy), 6), a = (0.55 + sp*0.075).toFixed(2);
      ctx.fillStyle = `rgba(${pc[0]},${pc[1]},${pc[2]},${a})`;
      ctx.fillRect(p.x, p.y, 1.8, 1.8);
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', buildCloud);
  buildCloud(); tick();

  // 切換分頁
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    b.classList.add('active');
    document.getElementById(b.dataset.view).classList.add('active');
    if(b.dataset.view === 'about') buildCloud();
  }));

  // 切換暗色和亮色
  const root = document.documentElement, icon = document.getElementById('themeIcon'), label = document.getElementById('themeLabel');
  function applyTheme(t){ root.dataset.theme = t; icon.textContent = t === 'dark' ? '☾' : '☀'; label.textContent = t; pc = themePC(); }
  applyTheme(localStorage.getItem('theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next); localStorage.setItem('theme', next);
  });
  </script>
</body>
</html>
