    @media(max-width:600px){

        summary: "A smart aquaculture management system preserves the experience and data that were hard to accumulate before. It helps the industry pass knowledge down & make data-driven decisions.",
        tags: ["System Design", "Cloud Deployment", "IoT", "Data Pipeline"],
        video: "",
        blocks: [
          { h: "Problem", body: "Traditional aquaculture struggles to pass knowledge down. There's just a little scientific data on record, and technique is mostly handed down by word of mouth (how green the water should look, how the feed should be given). That makes it hard for younger fishers to learn from the veterans before them." },
          { h: "Approach", body: "Our team deployed a <strong>cloud feeding-management system</strong> that records everything across an entire grow-out season, including splash-distribution maps, daily feeding logs, and the <strong>feed-conversion ratio (換肉率)</strong>. It also adapts its parameters to the fish's appetite on the day and to the farmer's own culture plan, leaving room for flexible adjustment." },
          { h: "Outcome", body: "By keeping data as a scientific record, hard-won farming experience can be passed on far more precisely. For instance, splash-distribution data, shown as a <strong>heatmap</strong>, lets fishers see when the fish tend to feed and whether they have been eating normally. This project help the industry pass knowledge down and make data-driven decisions." }
        ] },

      { group: "Patent", cover: "data/project/patent_twi892930.png", coverPos: "center 33%",
        title: "Smart Fish Feeding Intensity Identification System and Method", zh: "智慧投餌強度辨識系統及方法",
        summary: "A method captures the splashes fish make while scrambling for feed and reads their size to infer how long and how much the fish eat. Over time, those changes reveal the fish's appetite trend.",
        tags: ["Smart Aquaculture", "Fish Feeding", "Image Analysis"],
        blocks: [
          { h: "Invention", body: "A smart feeding intensity recognition system and method. An image-capture device obtains images of the water splashes fish make while scrambling for feed at the farm, and analyses the size of those splashes to determine how long and how much the fish are feeding. Over a period of time, the changes in feeding duration and splash size reveal the fish's appetite trend." },
          { h: "Detail", body: "Granted invention patent <strong>TWI892930</strong>, awarded in <strong>August 2025</strong> by the Taiwan Intellectual Property Office (TIPO). It came from a National Taiwan Ocean University team across the <strong>Department of Computer Science and Engineering (資工系), Department of Aquaculture (養殖系), and Department of Electrical Engineering (電機系)</strong>, with me as a co-inventor." }
        ] },

      { group: "Internship", cover: "data/project/5G_Jump_2023.png", title: "5G Core & Deep Learning", zh: "",
        summary: "5G brings many differentiated-SLA scenarios that make the network more capable but also more complex. The team added intelligence to the core with 3GPP's NWDAF, predicting user mobility to drive smarter network-slice control.",
        tags: ["5G Core", "NWDAF", "Network Slice", "K8s", "Deep Learning"],
        blocks: [
          { h: "Problem", body: "The 5G era brings many scenarios with differentiated SLA demands. They hand operators more capability but also make the network architecture far more complex, so network services need to grow smarter to hold quality of service across such varied use cases." },
          { h: "Approach", body: "The team implemented <strong>NWDAF</strong> (3GPP R15), building both of its core functions, <strong>MTLF</strong> (model training) and <strong>AnLF</strong> (analytics), and deployed the <strong>free5GC</strong> core on <strong>Kubernetes</strong>. A demo scenario simulating office activity, with UEs generated by <strong>UERANSIM</strong>, predicts each UE's mobility to guide network-slice control and resource scheduling. Through NWDAF, the team collects registered UE contexts from the AMF and takes their TAC as the mobility feature to build the training dataset; at inference, the model reads the last several time units to predict a UE's next location." },
          { h: "Outcome", body: "Delivered a working <strong>proof of concept</strong>: UE-mobility prediction feeding into network-slice scheduling. The work won an <strong>Honorable Mention</strong> at the Institute for Information Industry (資策會) 5G Jump Competition, 2023." }
        ] },

      { group: "Senior Project", cover: "data/project/admin_page.png", title: "Unmanned Access Control Station", zh: "無人門禁系統",
        summary: "During COVID-19, I built a contactless entrance system on a Raspberry Pi with my roommate, using a library entrance drawn from my own experience there to frame the problem and design the solution. It checks temperature, controls access, and tracks occupancy with no staff at the entrance.",
        tags: ["Access Control", "IoT", "Database", "Automation"],
        video: "",
        blocks: [
          { h: "Problem", body: "During COVID-19, public places had to enforce real-name entry and temperature checks at the entrance. The library where I worked already logged daily entries and swept for anyone left inside at closing; the pandemic added the job of taking every reader's temperature on the way in. That meant more staff on the payroll and more time spent exposed at the entrance." },
          { h: "Approach", body: "Using a <strong>Raspberry Pi 4</strong>, an <strong>RFID reader</strong> and a temperature sensor, I built a management system that keeps the original entry/exit logging and adds automatic temperature measurement, an anomaly-entry alert, and live in-library occupancy tracking. It spans the full stack: a backend database, a front-end admin console, and the on-site sensor setup." },
          { h: "Outcome", body: "Total hardware cost came in under <strong>NT$3,000</strong>, and by design it keeps front-line staff away from the entrance, cutting their exposure risk during the pandemic." }
        ] },

      { group: "First Project", cover: "data/project/where_to_transfer_main.png", title: "Where to Transfer", zh: "",
        summary: "This was my first coding project, a web app for the Keelung-to-Taipei commute. It compares each train-to-MRT transfer by travel time and fare, so riders can pick the fastest or the cheapest.",
        tags: ["Web App", "jQuery", "Route Planning"],
        blocks: [
          { h: "Problem", body: "As an Ocean University student, getting from Keelung to Taipei back in December 2019 meant either the train or a coach, and I preferred the train. (Since then, more direct coaches have made the trip easier.) The train stops at several Taipei stations where you can transfer to the MRT, and each transfer point gives a different route, time, and fare to where you are actually headed." },
          { h: "Approach", body: "We built it with HTML, CSS, and JavaScript (<strong>jQuery</strong>). Pick a destination station and the app lays out each train-to-MRT transfer option, with the travel time and fare side by side, so a rider can compare at a glance and choose." },
          { h: "Outcome", body: "Passengers get a quick way to compare transfer options and pick the fastest or the cheapest way to their destination." }
        ] }
    ]
  };
  const coverImg = p => {
    const st = [p.coverFit && `object-fit:${p.coverFit}`, p.coverPos && `object-position:${p.coverPos}`].filter(Boolean).join(';');
    return `<img src="${p.cover}" alt="${p.title}"${st ? ` style="${st}"` : ''}>`;
  };
  const cover = p => p.cover ? coverImg(p) : 'cover image';

  // image carousel (auto-rotating on cards, arrow/dot navigation in the modal)
  const carousel = (p, interactive) => {
    const fit = p.coverFit ? ` style="object-fit:${p.coverFit}"` : '';
    return `<div class="carousel">
      ${p.images.map((src, k) => `<div class="cslide${k === 0 ? ' on' : ''}"><img src="${src}" alt="${p.title} ${k + 1}"${fit}></div>`).join('')}
      ${interactive ? `<button class="cnav prev" type="button" aria-label="Previous">‹</button><button class="cnav next" type="button" aria-label="Next">›</button>` : ''}
      <div class="cdots">${p.images.map((_, k) => `<i class="${k === 0 ? 'on' : ''}"></i>`).join('')}</div>
    </div>`;
  };
  const media = (p, interactive) => p.images?.length ? carousel(p, interactive) : cover(p);

  // carousel state helpers
  const curSlide = car => [...car.querySelectorAll('.cslide')].findIndex(s => s.classList.contains('on'));
  function setSlide(car, idx){
    car.querySelectorAll('.cslide').forEach((s, k) => s.classList.toggle('on', k === idx));
    car.querySelectorAll('.cdots i').forEach((d, k) => d.classList.toggle('on', k === idx));
  }

  const project = (p, i) => `
    <button class="pcard" type="button" data-i="${i}">
      <div class="pcover">${media(p, false)}</div>
      <div class="pbody">
        ${p.group ? `<div class="pgroup-tag">${p.group}</div>` : ''}
        <div class="ptitle">${p.title}</div>
        <div class="psum">${p.summary || ''}</div>
        ${p.tags?.length ? `<div class="tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
        <div class="pmore">View details →</div>
      </div>
    </button>`;

  // modal detail for one project
  const projectModal = p => `
    <div class="modal-backdrop"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="${p.title}">
      <button class="modal-close" aria-label="Close">✕</button>
      <div class="modal-media">${p.video
        ? `<iframe src="https://www.youtube.com/embed/${p.video}" title="${p.title} demo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
        : ((p.images?.length || p.cover) ? media(p, true) : `<div class="ph">${'video' in p ? 'demo video coming soon' : 'cover image'}</div>`)}</div>
      <div class="modal-body">
        ${p.group ? `<div class="pgroup-tag">${p.group}</div>` : ''}
        <div class="modal-title">${p.title}${p.zh ? ` <span class="zh">${p.zh}</span>` : ''}</div>
        ${p.blocks.map(b => `<div class="pblock"><b>${b.h}</b><p>${b.body}</p></div>`).join('')}
        <div class="plinks">
          ${p.link ? `<a class="plink" href="${p.link.url}" target="_blank">${p.link.label}</a>` : ''}
          ${p.video ? `<a class="plink" href="https://youtu.be/${p.video}" target="_blank">Watch demo ↗</a>` : ''}
        </div>
      </div>
    </div>`;

  function render(){
    const p = DATA.profile;
    document.title = `${p.cloudName} · ${p.title}`;
    document.getElementById('tbName').textContent = p.cloudName;

    document.getElementById('about').innerHTML = `
      <div class="hero">
        ${p.photo ? `<img class="avatar" src="${p.photo}" alt="${p.formalName}">` : ''}
        <p class="greet">Hi, I'm</p>
        <div class="namecloud"><canvas id="nameCanvas"></canvas></div>
        <p class="aka"><b>${p.formalName}</b> · ${p.zhName}</p>
        <p class="role-title">${p.title}</p>
        ${p.location ? `<p class="loc">${p.location}</p>` : ''}
      </div>
      ${p.bio ? `<p class="bio">${p.bio}</p>` : ''}
      ${p.focus?.length ? `<p class="sec-title">What I Work On</p>
      <div class="focus">${p.focus.map(f => `<div class="focus-item"><div class="ft">${f.title}</div>${f.note ? `<div class="fn">${f.note}</div>` : ''}</div>`).join('')}</div>` : ''}
      <div class="links">
        <a class="btn out" href="${p.links.github}" target="_blank">GitHub</a>
        <a class="btn out" href="${p.links.linkedin}" target="_blank">LinkedIn</a>
        ${p.links.email ? `<a class="btn out" href="mailto:${p.links.email}">Email</a>` : `<span class="btn out soon">Email</span>`}
        ${p.links.resume ? `<a class="btn out" href="${p.links.resume}" target="_blank">Resume ↓</a>` : ''}
      </div>`;

    const roleH = x => `${x.role}${x.when ? ` <span class="when">${x.when}</span>` : ''}`;
    const tagsHTML = x => x.tags?.length ? `<div class="tags">${x.tags.map(t => `<span>${t}</span>`).join('')}</div>` : '';
    const bulletsAward = x => `${x.bullets?.length ? `<ul>${x.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}${x.award ? `<div class="award">${x.award}</div>` : ''}`;
    // company + date on the left, role + tags on the right; bullets expand in place
    const sxRow = x => `<div class="sx-item">
      <div class="sx-head"><span class="sx-left"><span class="sx-org">${x.org}</span><span class="sx-date">${x.date}</span></span><span class="sx-right"><span class="sx-line"><span class="sx-role">${roleH(x)}</span><span class="exp-chev">⌄</span></span>${tagsHTML(x)}</span></div>
      <div class="exp-wrap"><div class="exp-in"><div class="exp-pad">${bulletsAward(x)}</div></div></div></div>`;
    document.getElementById('experience').innerHTML =
      `<p class="exp-lbl">Work</p>` + DATA.experience.map(sxRow).join('') +
      `<p class="exp-lbl second">Education</p>` + DATA.education.map(sxRow).join('');

    document.getElementById('projects').innerHTML =
      `<div class="pgrid">` + DATA.projects.map(project).join('') + `</div>`;
  }
  render();

  // experience: expand a role's detail in place
  document.getElementById('experience').addEventListener('click', e => {
    const head = e.target.closest('.sx-head');
    if(!head) return;
    const item = head.closest('.sx-item');
    const open = item.classList.toggle('open');
    head.setAttribute('aria-expanded', open);
  });

  // auto-rotate every card carousel
  document.querySelectorAll('#projects .carousel').forEach(car => {
    const n = car.querySelectorAll('.cslide').length;
    if(n > 1) setInterval(() => setSlide(car, (curSlide(car) + 1) % n), 2800);
  });

  // projects: click a card to open its detail in a modal
  const pmodal = document.getElementById('pmodal');
  function openProject(i){
    pmodal.innerHTML = projectModal(DATA.projects[i]);
    pmodal.hidden = false;
    document.body.style.overflow = 'hidden';
    const car = pmodal.querySelector('.carousel');
    if(car){
      const n = car.querySelectorAll('.cslide').length;
      car.addEventListener('click', e => {
        if(e.target.closest('.cnav.next')) setSlide(car, (curSlide(car) + 1) % n);
        else if(e.target.closest('.cnav.prev')) setSlide(car, (curSlide(car) - 1 + n) % n);
        else { const di = [...car.querySelectorAll('.cdots i')].indexOf(e.target); if(di >= 0) setSlide(car, di); }
      });
    }
  }
  function closeProject(){
    pmodal.hidden = true;
    pmodal.innerHTML = '';
    document.body.style.overflow = '';
  }
  document.getElementById('projects').addEventListener('click', e => {
    const card = e.target.closest('.pcard');
    if(card) openProject(+card.dataset.i);
  });
  pmodal.addEventListener('click', e => {
    if(e.target.closest('.modal-close') || e.target.classList.contains('modal-backdrop')) closeProject();
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !pmodal.hidden) closeProject(); });

  // name particle cloud: sample the name to points, settle into place on load
  const canvas = document.getElementById('nameCanvas'), ctx = canvas.getContext('2d');
  let W, H, parts = [];
  const themePC = () => document.documentElement.dataset.theme === 'light' ? [26,107,84] : [168,240,207];
  let pc = themePC();

  function buildCloud(){
    if(!canvas.clientWidth) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const ox = off.getContext('2d');
    ox.fillStyle = '#fff'; ox.textAlign = 'center'; ox.textBaseline = 'middle';
    ox.font = '800 ' + Math.min(W*0.19, 100) + 'px Inter, sans-serif';
    ox.fillText(DATA.profile.cloudName, W/2, H/2);
    const img = ox.getImageData(0,0,W,H).data;
    parts = []; const gap = Math.max(3, Math.round(W/240));
    for(let yy=0; yy<H; yy+=gap) for(let xx=0; xx<W; xx+=gap){
      if(img[(yy*W+xx)*4+3] > 128) parts.push({hx:xx, hy:yy, x:Math.random()*W, y:Math.random()*H, vx:0, vy:0});
    }
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.vx += (p.hx-p.x)*0.012; p.vy += (p.hy-p.y)*0.012;
      p.vx *= 0.86; p.vy *= 0.86; p.x += p.vx; p.y += p.vy;
      const sp = Math.min(Math.abs(p.vx)+Math.abs(p.vy), 6), a = (0.55 + sp*0.075).toFixed(2);
      ctx.fillStyle = `rgba(${pc[0]},${pc[1]},${pc[2]},${a})`;
      ctx.fillRect(p.x, p.y, 1.8, 1.8);
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', buildCloud);
  buildCloud(); tick();

  // 切換分頁
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    b.classList.add('active');
    document.getElementById(b.dataset.view).classList.add('active');
    if(b.dataset.view === 'about') buildCloud();
  }));

  // 切換暗色和亮色
  const root = document.documentElement, icon = document.getElementById('themeIcon'), label = document.getElementById('themeLabel');
  function applyTheme(t){ root.dataset.theme = t; icon.textContent = t === 'dark' ? '☾' : '☀'; label.textContent = t; pc = themePC(); }
  applyTheme(localStorage.getItem('theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next); localStorage.setItem('theme', next);
  });
  </script>
</body>
</html>
